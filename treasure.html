<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>The Treasure Chest</title>
<style>
  :root { --gold:#f4d477; --gold-d:#c8971f; --gold-hi:#fff6cf; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; overflow:hidden; background:#04061a; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(1200px 800px at 50% 38%, #14235f 0%, #0a1030 45%, #04061a 100%);
    touch-action:none; -webkit-user-select:none; user-select:none;
  }
  #stars { position:fixed; inset:0; width:100%; height:100%; display:block; }
  #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  svg#scene { width:min(100vw, 133vh); height:auto; overflow:visible; }

  /* hint ring pulsing at the lock */
  #hint { opacity:0; transition:opacity .3s; }
  #hint.show { opacity:1; animation:pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{ transform:scale(1); opacity:.35;} 50%{ transform:scale(1.35); opacity:.9;} }

  /* the key */
  #key { cursor:grab; filter:drop-shadow(0 6px 10px rgba(0,0,0,.45)); }
  #key.grabbing { cursor:grabbing; }
  #key.smooth { transition: transform .55s cubic-bezier(.2,.8,.25,1); }
  #keyIdle { animation:bobkey 2.4s ease-in-out infinite; transform-origin:center; }

  @keyframes bobkey { 0%,100%{ transform:translateY(0) rotate(0deg);} 50%{ transform:translateY(-10px) rotate(-3deg);} }

  /* lid opens */
  #lid { transform-box:fill-box; transform-origin: 50% 100%; transition: transform 1.15s cubic-bezier(.34,1.3,.5,1); }
  .open #lid { transform: rotate(-104deg); }

  #clasp { transition: transform .4s ease; transform-box:fill-box; transform-origin:50% 0%; }
  .open #clasp { transform: rotate(38deg) translateY(-2px); }

  /* interior glow grows when open */
  #innerGlow { opacity:0; transition:opacity 1s ease .3s; }
  .open #innerGlow { opacity:1; }

  /* colourful gems inside twinkle when open */
  #gems { opacity:0; transition:opacity .6s ease .35s; }
  .open #gems { opacity:1; }
  #gems .g { animation:twinkle 1.8s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
  @keyframes twinkle { 0%,100%{ opacity:.75; transform:scale(.96);} 50%{ opacity:1; transform:scale(1.08);} }

  /* the hero crystal rising out */
  #crystalG { opacity:0; transform-box:fill-box; transform-origin:50% 100%;
              transform: translateY(60px) scale(.25); }
  #crystalG.reveal { opacity:1; transform: translateY(-150px) scale(1);
                     transition: transform 1.5s cubic-bezier(.2,.7,.2,1.15), opacity .8s ease; }
  #crystalG.reveal #floaty { animation:floaty 3.2s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
  @keyframes floaty { 0%,100%{ transform:translateY(0) rotate(-1.5deg);} 50%{ transform:translateY(-14px) rotate(1.5deg);} }

  #rays { opacity:0; transform-box:fill-box; transform-origin:center; }
  #crystalG.reveal #rays { opacity:.5; animation:spin 18s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg);} }

  #halo { opacity:0; transform-box:fill-box; transform-origin:center; }
  #crystalG.reveal #halo { opacity:1; animation:breathe 2.6s ease-in-out infinite; }
  @keyframes breathe { 0%,100%{ transform:scale(1); opacity:.55;} 50%{ transform:scale(1.12); opacity:.85;} }

  /* white flash at the moment of unlocking */
  #flash { fill:#fff; opacity:0; }
  #flash.go { animation:flash .9s ease-out; }
  @keyframes flash { 0%{opacity:0;} 12%{opacity:.85;} 100%{opacity:0;} }

  /* caption + replay */
  #caption {
    position:fixed; left:0; right:0; bottom:11%; text-align:center;
    color:#eaf2ff; font-size:clamp(22px,4.5vw,44px); font-weight:800; letter-spacing:.5px;
    text-shadow:0 2px 18px rgba(90,150,255,.8), 0 0 6px rgba(255,255,255,.6);
    opacity:0; transform:translateY(14px); transition:opacity .8s ease, transform .8s ease;
    pointer-events:none;
  }
  #caption.show { opacity:1; transform:translateY(0); }
  #prompt {
    position:fixed; left:0; right:0; top:7%; text-align:center;
    color:#bcd0ff; font-size:clamp(15px,2.6vw,22px); font-weight:600; opacity:.9;
    transition:opacity .5s ease;
  }
  #controls { position:fixed; right:16px; bottom:16px; display:flex; gap:10px; }
  button {
    font:inherit; font-weight:700; color:#08122e; background:linear-gradient(#ffe9a8,#e9b93c);
    border:none; border-radius:999px; padding:10px 18px; cursor:pointer;
    box-shadow:0 4px 14px rgba(0,0,0,.4); opacity:0; pointer-events:none; transition:opacity .5s;
  }
  button.show { opacity:1; pointer-events:auto; }
  #muteBtn { opacity:1; pointer-events:auto; padding:10px 14px; }
  .sparkle { pointer-events:none; }
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div id="prompt">Drag the golden key to the lock 🔑</div>

<div id="wrap">
<svg id="scene" viewBox="0 0 1000 750" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a4d28"/><stop offset=".5" stop-color="#5c3719"/><stop offset="1" stop-color="#3f2410"/>
    </linearGradient>
    <linearGradient id="woodLid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a5a30"/><stop offset="1" stop-color="#5a3417"/>
    </linearGradient>
    <linearGradient id="goldg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff6cf"/><stop offset=".45" stop-color="#f4d477"/>
      <stop offset=".7" stop-color="#d4a72c"/><stop offset="1" stop-color="#a9781a"/>
    </linearGradient>
    <radialGradient id="innerG" cx="50%" cy="45%" r="60%">
      <stop offset="0" stop-color="#bfe0ff" stop-opacity=".95"/>
      <stop offset="1" stop-color="#123" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="haloG" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8fd0ff" stop-opacity=".9"/>
      <stop offset=".5" stop-color="#3a8fff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#3a8fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rayG" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#dff0ff" stop-opacity=".9"/>
      <stop offset="1" stop-color="#dff0ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- soft ground glow under the chest -->
  <ellipse cx="500" cy="628" rx="250" ry="34" fill="#2b4fae" opacity=".35"/>

  <!-- interior opening (revealed as the lid lifts) -->
  <g>
    <rect x="345" y="452" width="310" height="120" rx="16" fill="#160d08"/>
    <ellipse id="innerGlow" cx="500" cy="470" rx="150" ry="60" fill="url(#innerG)"/>
    <!-- colourful gems -->
    <g id="gems"></g>
  </g>

  <!-- hero crystal (rises from inside; sits behind the front wall) -->
  <g id="crystalG">
    <g id="rays">
      <g id="raysInner"></g>
    </g>
    <circle id="halo" cx="500" cy="470" r="150" fill="url(#haloG)"/>

<script>
(function(){
  "use strict";
  const scene = document.getElementById('scene');
  const key   = document.getElementById('key');
  const keyIdle = document.getElementById('keyIdle');
  const hint  = document.getElementById('hint');
  const crystalG = document.getElementById('crystalG');
  const flash = document.getElementById('flash');
  const caption = document.getElementById('caption');
  const prompt = document.getElementById('prompt');
  const replayBtn = document.getElementById('replayBtn');
  const muteBtn = document.getElementById('muteBtn');

  const LOCK = { x:500, y:540 };     // keyhole in SVG coords
  const START = { x:735, y:560, rot:-38 };
  let keyPos = { x:START.x, y:START.y, rot:START.rot };
  let dragging = false, grab = {x:0,y:0}, opened = false;

  // ---- helpers: screen <-> svg coords ----
  function toSVG(clientX, clientY){
    const pt = scene.createSVGPoint(); pt.x = clientX; pt.y = clientY;
    return pt.matrixTransform(scene.getScreenCTM().inverse());
  }
  function setKey(){ key.setAttribute('transform', `translate(${keyPos.x},${keyPos.y}) rotate(${keyPos.rot})`); }
  setKey();

  // ================= colourful gems inside =================
  const gemColors = ['#ff5d7d','#ffd23f','#59d36a','#4bc6ff','#b46bff','#ff8a3d','#ffffff'];
  const gemsG = document.getElementById('gems');
  for(let i=0;i<16;i++){
    const cx = 360 + Math.random()*280, cy = 470 + Math.random()*70;
    const s = 9 + Math.random()*9, c = gemColors[i % gemColors.length];
    const p = document.createElementNS('http://www.w3.org/2000/svg','path');
    p.setAttribute('class','g');
    p.setAttribute('d', `M${cx} ${cy-s} L${cx+s} ${cy} L${cx} ${cy+s} L${cx-s} ${cy} Z`);
    p.setAttribute('fill', c); p.setAttribute('opacity','.9');
    p.style.animationDelay = (Math.random()*1.8)+'s';
    gemsG.appendChild(p);
  }
  // ================= light rays behind crystal =================
  const raysInner = document.getElementById('raysInner');
  for(let i=0;i<12;i++){
    const a = (i/12)*Math.PI*2;
    const x1 = 500 + Math.cos(a)*40, y1 = 470 + Math.sin(a)*40;
    const x2 = 500 + Math.cos(a)*230, y2 = 470 + Math.sin(a)*230;
    const w = 18;
    const nx = Math.cos(a+Math.PI/2), ny = Math.sin(a+Math.PI/2);
    const poly = document.createElementNS('http://www.w3.org/2000/svg','path');
    poly.setAttribute('d', `M${x1+nx*w} ${y1+ny*w} L${x2} ${y2} L${x1-nx*w} ${y1-ny*w} Z`);
    poly.setAttribute('fill','url(#rayG)');
    raysInner.appendChild(poly);
  }

  // ================= tiny sound kit (WebAudio) =================
  let ac=null, muted=false;
  function actx(){ if(!ac){ try{ ac = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return ac; }
  function blip(freq, dur, type, vol){
    if(muted) return; const a=actx(); if(!a) return;
    const o=a.createOscillator(), g=a.createGain();
    o.type=type||'sine'; o.frequency.value=freq;
    g.gain.value=0.0001; o.connect(g); g.connect(a.destination);
    const t=a.currentTime; g.gain.exponentialRampToValueAtTime(vol||0.2, t+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.start(t); o.stop(t+dur+0.02);
  }
  function clickSound(){ blip(320,0.08,'square',0.18); setTimeout(()=>blip(220,0.09,'square',0.15),70); }
  function creak(){ if(muted)return; const a=actx(); if(!a)return;
    const o=a.createOscillator(), g=a.createGain(); o.type='sawtooth';
    o.frequency.setValueAtTime(90,a.currentTime);
    o.frequency.linearRampToValueAtTime(160,a.currentTime+0.9);
    g.gain.value=0.0001; o.connect(g); g.connect(a.destination);
    g.gain.exponentialRampToValueAtTime(0.08,a.currentTime+0.05);
    g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+1.0);
    o.start(); o.stop(a.currentTime+1.05);
  }
  function chime(){ [0,4,7,12,16].forEach((s,i)=> setTimeout(()=>blip(523.25*Math.pow(2,s/12),0.6,'sine',0.16), i*110)); }

  // ================= drag the key =================
  function pointerDown(e){
    if(opened) return;
    const p = toSVG(e.clientX, e.clientY);
    grab.x = p.x - keyPos.x; grab.y = p.y - keyPos.y;
    dragging = true; key.classList.add('grabbing'); key.classList.remove('smooth');
    keyIdle.style.animation='none';            // stop bobbing while held
    prompt.style.opacity='0';
    actx();                                    // unlock audio on gesture
    scene.setPointerCapture && scene.setPointerCapture(e.pointerId);
  }
  function pointerMove(e){
    if(!dragging) return;
    const p = toSVG(e.clientX, e.clientY);
    keyPos.x = p.x - grab.x; keyPos.y = p.y - grab.y;
    setKey();
    const d = Math.hypot(keyPos.x-LOCK.x, keyPos.y-LOCK.y);
    hint.classList.toggle('show', d < 150 && !opened);
  }
  function pointerUp(e){
    if(!dragging) return;
    dragging=false; key.classList.remove('grabbing');
    const d = Math.hypot(keyPos.x-LOCK.x, keyPos.y-LOCK.y);
    if(d < 150 && !opened){ insertAndOpen(); }
    else { key.classList.add('smooth'); keyPos={x:START.x,y:START.y,rot:START.rot}; setKey();
           setTimeout(()=>{ if(!opened) keyIdle.style.animation=''; }, 560); }
  }
  scene.addEventListener('pointerdown', e=>{ if(e.target.closest('#key')) pointerDown(e); });
  window.addEventListener('pointermove', pointerMove);
  window.addEventListener('pointerup', pointerUp);

  // ================= the unlock + reveal sequence =================
  function insertAndOpen(){
    opened = true; hint.classList.remove('show');
    key.classList.add('smooth');
    keyPos = { x:LOCK.x, y:LOCK.y, rot:0 }; setKey();   // slide the key in, upright
    setTimeout(()=>{ clickSound(); keyPos.rot = 90; setKey(); }, 560);   // turn the key
    setTimeout(()=>{ flash.classList.add('go'); creak(); scene.classList.add('open'); }, 1080); // unlock + open lid
    setTimeout(()=>{ crystalG.classList.add('reveal'); chime(); burstSparkles(); }, 1950);       // crystal rises
    setTimeout(()=>{ caption.classList.add('show'); replayBtn.classList.add('show'); }, 2700);    // celebrate
  }

  // ================= replay =================
  function reset(){
    opened=false; dragging=false;
    scene.classList.remove('open');
    crystalG.classList.remove('reveal');
    flash.classList.remove('go');
    caption.classList.remove('show');
    replayBtn.classList.remove('show');
    key.classList.add('smooth');
    keyPos={x:START.x,y:START.y,rot:START.rot}; setKey();
    prompt.style.opacity='.9';
    setTimeout(()=>{ keyIdle.style.animation=''; }, 560);
    // clear sparkles
    document.getElementById('crystalSpark').innerHTML='';
  }
  replayBtn.addEventListener('click', reset);
  muteBtn.addEventListener('click', ()=>{ muted=!muted; muteBtn.textContent = muted?'🔇':'🔊'; });

  // ================= sparkles on reveal =================
  function burstSparkles(){
    const g = document.getElementById('crystalSpark');
    for(let i=0;i<22;i++){
      const a=Math.random()*Math.PI*2, r=40+Math.random()*140;
      const x=500+Math.cos(a)*r, y=320+Math.sin(a)*r*0.9;
      const s=document.createElementNS('http://www.w3.org/2000/svg','circle');
      s.setAttribute('cx',500); s.setAttribute('cy',320); s.setAttribute('r', 2+Math.random()*3);
      s.setAttribute('fill', Math.random()<0.5?'#ffffff':'#bfe6ff'); s.setAttribute('class','sparkle');
      g.appendChild(s);
      s.animate([
        { transform:'translate(0,0)', opacity:1 },
        { transform:`translate(${x-500}px,${y-320}px)`, opacity:0 }
      ], { duration:900+Math.random()*700, easing:'cubic-bezier(.2,.7,.3,1)', fill:'forwards', delay:Math.random()*300 });
    }
  }

  // ================= starfield =================
  const cv=document.getElementById('stars'), cx2=cv.getContext('2d');
  let stars=[];
  function resize(){ cv.width=innerWidth; cv.height=innerHeight;
    stars=[]; const n=Math.min(220, Math.floor(innerWidth*innerHeight/9000));
    for(let i=0;i<n;i++) stars.push({x:Math.random()*cv.width,y:Math.random()*cv.height,
      r:Math.random()*1.4+0.2, p:Math.random()*Math.PI*2, s:0.6+Math.random()*1.2}); }
  resize(); addEventListener('resize', resize);
  (function draw(t){ cx2.clearRect(0,0,cv.width,cv.height);
    for(const st of stars){ const tw=0.5+0.5*Math.sin(t*0.001*st.s+st.p);
      cx2.globalAlpha=0.25+tw*0.75; cx2.fillStyle= tw>0.85?'#cfe4ff':'#ffffff';
      cx2.beginPath(); cx2.arc(st.x,st.y,st.r*(0.7+tw*0.6),0,7); cx2.fill(); }
    cx2.globalAlpha=1; requestAnimationFrame(draw); })(0);
})();
</script>
</body>
